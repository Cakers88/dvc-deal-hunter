name: test-alert

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send a test notification
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          test -n "$NTFY_URL" || { echo "NTFY_URL secret is not set"; exit 1; }
          curl -fsS -H "Title: DVC Deal Hunter is connected" -H "Tags: palm_tree" \
            -H "Click: https://cakers88.github.io/dvc-deal-hunter/" \
            -d "Test alert. Real alerts arrive when a new or price-dropped contract scores 75+." "$NTFY_URL" > /dev/null
          echo "sent"
