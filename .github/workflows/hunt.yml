name: hunt

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs a few minutes under load
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.yaml", "hunter/**", "reference/**", "docs/index.html", ".github/workflows/hunt.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape, score, alert
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m hunter.run

      - name: Commit data changes
        run: |
          git config user.name "dvc-deal-hunter[bot]"
          git config user.email "dvc-deal-hunter@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No listing changes"
          else
            NEW=$(python -c "import json;print(json.load(open('docs/data/health.json'))['events'])")
            git commit -m "data: $NEW"
            git pull --rebase -X theirs origin main || true
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
