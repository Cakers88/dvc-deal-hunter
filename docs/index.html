<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVC Deal Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F4; --card:#FFFFFF; --ink:#16302E; --soft:#577270; --line:#D3E1DD;
  --sea:#0D5C5F; --sea-deep:#093E40; --lagoon:#D6ECE8; --sand:#F5EAD3; --coral:#D2553B;
  --good:#1E7A4F; --good-bg:#E1F2E8; --warn:#9A6400; --warn-bg:#FBF0D8; --bad:#A63A22; --bad-bg:#FBE6E0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A1A; --card:#152424; --ink:#E4EFEC; --soft:#93ABA8; --line:#28403E;
  --sea:#5FB9B4; --sea-deep:#0A2C2D; --lagoon:#1C3634; --sand:#2B2618; --coral:#F07E62;
  --good:#6BD39C; --good-bg:#16302A; --warn:#E9B65A; --warn-bg:#2E2614; --bad:#F2876C; --bad-bg:#33201B;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;line-height:1.1}
a{color:var(--sea)}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 60px}
header{background:var(--sea-deep);color:#fff;padding:22px 0 18px}
header h1{font-size:30px;font-weight:500}
header h1 em{font-style:italic;font-weight:700}
.sub{color:#B8D8D4;font-size:13px;margin-top:6px}
.health{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.pill.bad{background:#7A2B1C;border-color:#B4503A}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 11px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--sea);color:#fff}
select,input[type=number]{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:14px}
label.chk{font-size:13px;color:var(--soft);display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.count{font-size:13px;color:var(--soft);margin-left:auto}
.list{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.top{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;cursor:pointer}
.score{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font:700 20px Fraunces,serif;color:#fff;background:var(--sea)}
.score.s2{background:#4F8F8A}.score.s3{background:#8AA9A6}
.ttl{font-weight:600;font-size:16px}
.meta{font-size:13px;color:var(--soft);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--lagoon);color:var(--ink)}
.tag.good{background:var(--good-bg);color:var(--good)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.new{background:var(--coral);color:#fff}
.money{text-align:right}
.money .big{font:700 22px Fraunces,serif}
.money .small{font-size:12px;color:var(--soft)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.detail{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:none}
.card.open .detail{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.box{background:var(--bg);border-radius:10px;padding:12px}
.box h3{font-size:15px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.note{font-size:12px;color:var(--soft);margin-top:6px}
.plans td,.plans th{padding:4px 8px 4px 0}
.plans tr.sel td{font-weight:600}
.empty{padding:30px;text-align:center;color:var(--soft)}
.section{margin-top:28px}
.section h2{font-size:22px;margin-bottom:10px}
details.card summary{cursor:pointer;font-weight:600}
@media (max-width:600px){
  .controls{position:static}
  .top{grid-template-columns:46px 1fr}
  .score{width:46px;height:46px;font-size:18px}
  .money{grid-column:1/-1;text-align:left;display:flex;gap:12px;align-items:baseline}
}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>DVC <em>Deal Hunter</em></h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="health" id="health"></div>
</div></header>

<div class="wrap">
  <div class="controls">
    <div class="row">
      <div class="seg" id="trip"></div>
      <div class="seg" id="nights"><button data-v="5">5 nights</button><button data-v="6">6 nights</button></div>
      <div class="seg" id="who"><button data-v="one">Our family</button><button data-v="both">Both families</button></div>
    </div>
    <div class="row" style="margin-top:8px">
      <select id="resort"><option value="">All legacy resorts</option></select>
      <select id="sort">
        <option value="score">Sort: score</option>
        <option value="savings">Sort: savings vs renting</option>
        <option value="net">Sort: net cost</option>
        <option value="ppt">Sort: $/point</option>
        <option value="new">Sort: newest</option>
      </select>
      <input type="number" id="maxprice" placeholder="Max price" step="1000" style="width:120px">
      <label class="chk"><input type="checkbox" id="fitonly" checked>Covers this trip</label>
      <label class="chk"><input type="checkbox" id="noborrow">No borrowing</label>
      <label class="chk"><input type="checkbox" id="norofr">Hide high ROFR risk</label>
      <label class="chk"><input type="checkbox" id="fresh">New / dropped (48h)</label>
      <span class="count" id="count"></span>
    </div>
  </div>
  <div class="list" id="list"></div>

  <div class="section">
    <h2>Market snapshot</h2>
    <div class="card"><table id="market"></table>
      <div class="note">Available legacy contracts we're tracking right now. "Avg resale" is the recent average closed price used as the resale ceiling in the plans.</div></div>
  </div>

  <div class="section">
    <h2>How the numbers work</h2>
    <details class="card"><summary>Assumptions and method</summary>
      <div id="method" style="margin-top:10px;font-size:14px"></div>
    </details>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'—':'$'+Math.round(n).toLocaleString();
const fdate=s=>{if(!s)return'—';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};
const MON=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const RISK={low:'good',medium:'warn',high:'bad'};
let D,H,KEYS,state=load();
function load(){try{return JSON.parse(localStorage.getItem('dvc-state'))||{}}catch(e){return{}}}
function save(){try{localStorage.setItem('dvc-state',JSON.stringify(state))}catch(e){}}

async function init(){
  try{
    [D,H]=await Promise.all([fetch('data/index.json').then(r=>r.json()),fetch('data/health.json').then(r=>r.json()).catch(()=>null)]);
  }catch(e){$('#sub').textContent='Could not load data yet — the first run may still be in progress.';return}
  KEYS=D.plan_keys;
  D.listings.forEach(x=>x.P=x.plans.map(p=>Object.fromEntries(KEYS.map((k,i)=>[k,p[i]]))));
  state.trip=state.trip||D.config.trips[0].id; state.nights=state.nights||Math.max(...D.config.trips[0].nights); state.who=state.who||'both';
  $('#trip').innerHTML=D.config.trips.map(t=>`<button data-v="${t.id}">${t.name}</button>`).join('');
  const resorts=[...new Set(D.listings.map(x=>x.resort_name))].sort();
  $('#resort').innerHTML+=resorts.map(r=>`<option>${r}</option>`).join('');
  for(const id of ['trip','nights','who']) $('#'+id).onclick=e=>{const b=e.target.closest('button');if(!b)return;state[id]=id==='nights'?+b.dataset.v:b.dataset.v;save();render()};
  for(const id of ['resort','sort','maxprice','fitonly','noborrow','norofr','fresh']){
    const el=$('#'+id); if(state[id]!=null){el.type==='checkbox'?el.checked=state[id]:el.value=state[id]}
    el.onchange=()=>{state[id]=el.type==='checkbox'?el.checked:el.value;save();render()};
  }
  const up=H?new Date(H.updated):null;
  $('#sub').textContent=`${D.count} contracts scored · data checked ${up?up.toLocaleString():'—'} · today ${fdate(D.today)}`;
  if(H){$('#health').innerHTML=Object.entries(H.sources).map(([k,v])=>`<span class="pill ${v.ok?'':'bad'}" title="${v.error||''}">${k} ${v.ok?v.count:'⚠'}</span>`).join('')+
    (H.events?`<span class="pill">this run: ${H.events.new} new · ${H.events.price_change} price · ${H.events.gone} gone</span>`:'')}
  market(); method(); render();
}
function plan(x){return x.P.find(p=>p.trip===state.trip&&p.nights===state.nights&&p.scenario===state.who)}
function isFresh(x){const t=Date.now()-new Date(x.first_seen).getTime();return t<48*3600e3||x.prev_price}
function render(){
  for(const id of ['trip','nights','who'])$('#'+id).querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(state[id])===b.dataset.v));
  let rows=D.listings.map(x=>({x,p:plan(x)})).filter(({x,p})=>p);
  if($('#fitonly').checked)rows=rows.filter(r=>r.p.fit!=='no');
  if($('#noborrow').checked)rows=rows.filter(r=>r.p.fit==='yes');
  if($('#norofr').checked)rows=rows.filter(r=>r.x.rofr!=='high');
  if($('#fresh').checked)rows=rows.filter(r=>isFresh(r.x));
  const rs=$('#resort').value; if(rs)rows=rows.filter(r=>r.x.resort_name===rs);
  const mp=+$('#maxprice').value; if(mp)rows=rows.filter(r=>r.x.price<=mp);
  const s=$('#sort').value;
  const key={score:r=>-r.x.score,savings:r=>-(r.p.fit==='no'?-1e9:r.p.savings),net:r=>r.p.fit==='no'?1e9:r.p.net_cost,ppt:r=>r.x.ppt,new:r=>-new Date(r.x.first_seen)}[s];
  rows.sort((a,b)=>key(a)-key(b));
  $('#count').textContent=`${rows.length} shown`;
  $('#list').innerHTML=rows.slice(0,150).map(card).join('')||'<div class="empty">Nothing matches these filters right now.</div>';
  $('#list').querySelectorAll('.top').forEach(t=>t.onclick=()=>toggle(t.parentElement));
}
function card({x,p}){
  const cls=x.score>=80?'':x.score>=65?'s2':'s3';
  const fit=p.fit==='yes'?'<span class="tag good">Covers it</span>':p.fit==='borrow'?`<span class="tag warn">Covers with ${p.borrow} borrowed</span>`:'<span class="tag bad">Not enough points</span>';
  const tags=[fit,`<span class="tag ${RISK[p.booking_risk]}">Book ${fdate(p.book_on)}</span>`,`<span class="tag ${RISK[x.rofr]}">ROFR ${x.rofr}</span>`];
  if(Date.now()-new Date(x.first_seen).getTime()<48*3600e3)tags.unshift('<span class="tag new">New</span>');
  if(x.prev_price)tags.unshift(`<span class="tag new">Dropped from ${fmt(x.prev_price)}</span>`);
  if(x.subsidized)tags.push('<span class="tag">Subsidized dues</span>');
  if(x.aggregator_only)tags.push('<span class="tag warn">Only on aggregator</span>');
  const sav=p.fit==='no'?'':`<div class="small ${p.savings>=0?'pos':'neg'}">${p.savings>=0?'saves':'costs'} ${fmt(Math.abs(p.savings))} vs renting</div>`;
  return `<div class="card" data-fid="${x.fid}">
   <div class="top">
    <div class="score ${cls}">${Math.round(x.score)}</div>
    <div><div class="ttl">${x.resort_name} · ${x.points} pts · $${x.ppt}/pt</div>
     <div class="meta">${fmt(x.price)} · ${MON[x.use_year]} use year · ${x.source}${x.broker?' ('+x.broker+')':''} · ${x.listing_id}</div>
     <div class="tags">${tags.join('')}</div></div>
    <div class="money"><div class="big">${p.fit==='no'?'—':fmt(p.net_cost)}</div><div class="small">net cost after resale</div>${sav}</div>
   </div><div class="detail"></div></div>`;
}
async function toggle(c){
  c.classList.toggle('open'); const det=c.querySelector('.detail');
  if(!c.classList.contains('open')||det.dataset.loaded)return;
  det.innerHTML='Loading…';
  const x=D.listings.find(l=>l.fid===c.dataset.fid);
  const L=await fetch(`data/l/${x.fid}.json`).then(r=>r.json());
  const p=L.plans.find(q=>q.trip===state.trip&&q.nights===state.nights&&q.scenario===state.who);
  det.dataset.loaded=1; det.innerHTML=detail(x,L,p);
}
function detail(x,L,p){
  const pa=(x.points_available||[]).map(b=>`${MON[+b.uy.slice(5)]} ${b.uy.slice(0,4)}: ${b.points}${b.banked?` (${b.banked} banked in)`:''}`).join(' · ')||'not listed';
  const uy=`<div class="box"><h3>Points for this stay</h3><table>
   <tr><td>Stay needs (${p.view}-view, ${p.periods.join(', ')})</td><td class="r">${p.need}</td></tr>
   <tr><td>Use year holding the stay (starts ${fdate(p.uy_start)})</td><td class="r">${p.cur}${p.cur_assumed?'*':''}</td></tr>
   <tr><td>Bankable from prior year ${p.bankable?`(bank by ${fdate(p.bank_deadline)})`:''}</td><td class="r">${p.bankable}</td></tr>
   <tr><td>Usable without borrowing</td><td class="r"><b>${p.usable_no_borrow}</b></td></tr>
   <tr><td>Next year's points (borrowable)</td><td class="r">${p.next_uy}${p.next_assumed?'*':''}</td></tr>
   <tr><td>Left over after the trip</td><td class="r">${p.leftover}${p.leftover?` (~${fmt(p.leftover*D.config.assumptions.owner_rent_out_rate)} if rented out)`:''}</td></tr></table>
   <div class="note">Listed availability: ${pa}${p.cur_assumed||p.next_assumed?' · *assumed full allotment (not listed)':''}${p.bank_margin_days!=null?` · banking margin ${p.bank_margin_days} days after membership is set up`:''}</div>
   ${L.availability_text?`<div class="note">Broker says: ${esc(L.availability_text).slice(0,400)}</div>`:''}</div>`;
  const cost=`<div class="box"><h3>Buy → use → resell</h3><table>
   <tr><td>Price + closing + Disney fee</td><td class="r">${fmt(p.buy_total)}</td></tr>
   <tr><td>Dues while owned (${p.dues_rows.map(r=>r[0]+': '+fmt(r[1])+(r[2]==='seller'?' seller':'')).join(', ')})</td><td class="r">${fmt(p.dues_total)}</td></tr>
   <tr><td>Resale (${p.exit}, ~$${p.exit_ppt}/pt, after ${Math.round(D.config.assumptions.seller_commission_pct*100)}% commission)</td><td class="r">−${fmt(p.net_sale)}</td></tr>
   <tr><td><b>Net cost of the trip points</b></td><td class="r"><b>${fmt(p.net_cost)}</b></td></tr>
   <tr><td>Renting the same ${p.need} pts at $${D.config.assumptions.rent_rate_per_point}</td><td class="r">${fmt(p.rent_cost)}</td></tr>
   <tr><td>Break-even resale price</td><td class="r">$${p.breakeven_exit_ppt}/pt</td></tr>
   <tr><td>Most cash out at once</td><td class="r">${fmt(p.peak_cash_out)}</td></tr></table>
   <div class="note">Dues 2026: $${(+p.dues_rate_2026).toFixed(2)}/pt · market avg resale $${p.market_ppt}/pt · resale assumes the lower of what you pay and the market average.${p.harpta_withheld?` Hawaii holds back ${fmt(p.harpta_withheld)} at sale (refunded at tax time).`:''}</div>
   ${L.dues_terms?`<div class="note">Dues terms: ${esc(L.dues_terms).slice(0,300)}</div>`:''}</div>`;
  const cash=`<div class="box"><h3>Money in and out</h3><table>${p.cash.map(c=>`<tr><td>${fdate(c.date)}</td><td>${esc(c.what)}</td><td class="r ${c.amount>0?'pos':''}">${c.amount?(c.amount>0?'+':'−')+fmt(Math.abs(c.amount)):''}</td></tr>`).join('')}</table></div>`;
  const tm=`<div class="box"><h3>Timing</h3><table>
   <tr><td>Estimated closing</td><td class="r">${fdate(p.closing_est)}</td></tr>
   <tr><td>Membership ready</td><td class="r">${fdate(p.member_ready)}</td></tr>
   <tr><td>${x.resort==='aulani'?'Home-resort (11-mo)':'7-month'} window opens</td><td class="r">${fdate(p.window_opens)}</td></tr>
   <tr><td>You can book on</td><td class="r"><b>${fdate(p.book_on)}</b> ${p.days_late?`(${p.days_late}d after window)`:''}</td></tr>
   <tr><td>List for sale</td><td class="r">${fdate(p.list_on)}</td></tr>
   <tr><td>Sale proceeds</td><td class="r">${fdate(p.sale_close)}</td></tr></table>
   <div class="note">ROFR: ${esc(x.rofr_why)}</div></div>`;
  const all=`<div class="box" style="grid-column:1/-1"><h3>Every trip option</h3><table class="plans"><tr><th>Trip</th><th>Who</th><th class="r">Needs</th><th>Fits</th><th class="r">Net cost</th><th class="r">vs rent</th><th>Book</th></tr>${
   L.plans.map(q=>`<tr class="${q===p?'sel':''}"><td>${q.trip_name} ${q.nights}n</td><td>${q.scenario==='both'?'Both':'Ours'}</td><td class="r">${q.need}</td><td>${q.fit==='yes'?'✓':q.fit==='borrow'?'borrow '+q.borrow:'✗'}</td><td class="r">${q.fit==='no'?'—':fmt(q.net_cost)}</td><td class="r ${q.savings>=0?'pos':'neg'}">${q.fit==='no'?'':(q.savings>=0?'+':'−')+fmt(Math.abs(q.savings))}</td><td>${fdate(q.book_on)}</td></tr>`).join('')}</table>
   <div class="note">Score ${x.score}: coverage ${x.score_parts.coverage} · value ${x.score_parts.value} · booking ${x.score_parts.timing} · ROFR ${x.score_parts.rofr} · data ${x.score_parts.data} · freshness ${x.score_parts.freshness}${x.score_parts.over_budget?' · over budget (halved)':''}</div>
   <div class="note">Price history: ${(L.history||[]).map(h=>`${fdate(h.t.slice(0,10))} ${h.price?fmt(h.price):''} ${h.availability||''}`).join(' → ')}</div>
   <div class="note"><a href="${x.url}" target="_blank" rel="noopener">Open listing ↗</a> · first seen ${fdate((x.first_seen||'').slice(0,10))}${x.date_listed?` · listed ${fdate(x.date_listed)}`:''}${x.expiration?` · deed to ${x.expiration}`:''}</div></div>`;
  return `<div class="grid">${uy}${cost}${tm}${cash}${all}</div>`;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function market(){
  const by={};
  D.listings.forEach(x=>{(by[x.resort_name]=by[x.resort_name]||[]).push(x)});
  const med=a=>{a=[...a].sort((p,q)=>p-q);return a.length?a[Math.floor(a.length/2)]:null};
  const rows=Object.entries(by).sort((a,b)=>b[1].length-a[1].length).map(([r,a])=>{
    const p=a[0].P.find(q=>q.fit!=='no'&&q.scenario==='both');
    return `<tr><td>${r}</td><td class="r">${a.length}</td><td class="r">$${med(a.map(x=>x.ppt))}</td><td class="r">$${Math.min(...a.map(x=>x.ppt))}</td><td class="r">${a.filter(x=>x.rofr==='high').length}</td></tr>`});
  $('#market').innerHTML='<tr><th>Resort</th><th class="r">Available</th><th class="r">Median $/pt</th><th class="r">Lowest</th><th class="r">High ROFR</th></tr>'+rows.join('');
}
function method(){
  const a=D.config.assumptions;
  $('#method').innerHTML=`<p><b>Points needed</b> come from Disney's official 2027 Aulani chart (${D.config.view}-view). September 5–Oct 9 is the cheapest season; late June–Aug 8 is the most expensive.</p>
  <p><b>Usable points</b> are the points in the use year that contains your check-in, plus last year's points if you'd own the contract before the banking deadline (8 months into that use year). Points above a contract's annual size are treated as already banked (can't be re-banked). Borrowing next year's points is shown separately because it leaves the contract stripped when you sell.</p>
  <p><b>Booking:</b> Aulani contracts book at 11 months; every other legacy resort at 7 months. Closing is estimated at ${a.close_days_aulani} days (Aulani) or ${a.close_days_other} days (others) from today, plus ${a.membership_setup_days} days to show up in the member account.</p>
  <p><b>Resale:</b> we compare selling right after the trip (with a $${a.stripped_discount_per_point}/pt discount if the current year's points are used up) against waiting for the next use year to load, and pick the cheaper. Resale price is the lower of what you paid and the resort's recent average closed price; commission ${Math.round(a.seller_commission_pct*100)}% plus Disney's estoppel fee. Hawaii withholds ${(a.harpta_pct*100).toFixed(2)}% of Aulani sale proceeds for non-resident sellers until you file a Hawaii return.</p>
  <p><b>Dues</b> use each listing's rate (or the resort's 2026 rate) grown at the resort's 5-year trend, prorated by calendar year for the time you own it. Where the broker says the seller pays a year, it's excluded.</p>
  <p><b>Renting comparison:</b> $${a.rent_rate_per_point}/pt. Hawaii's occupancy tax (~$0.82/pt in 2027) is paid either way, so it's not in the comparison.</p>
  <p><b>ROFR risk</b> compares the asking $/pt with the highest prices Disney has paid to buy back contracts at that resort over the past 13 months.</p>
  <p><b>Score (0–100):</b> coverage of your trips (35), value vs renting (35), booking timing (10), ROFR risk (10), data completeness (6), freshness (4). September counts slightly more than July.</p>`;
}
